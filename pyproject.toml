[project]
name = "uarb-agent"
version = "0.1.0"
description = "Email agent that fetches UARB regulatory documents"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.39.0",
    "playwright>=1.64.1",
]

[project.scripts]
uarb = "uarb_agent.cli:main"
uarb-mail = "uarb_agent.mail:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uarb_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
